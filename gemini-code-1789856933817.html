    <!-- Tailwind CSS CDN Seguro -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.17/index.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/index.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #ffffff;
            --bg-dark: #0a0a0a;
            --accent: #ef4444;
            --surface: #171717;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--primary);
            overflow-x: hidden;
            padding-bottom: 70px; /* Espacio para el banner fijo de WhatsApp */
        }

        h1, h2, h3, .brand-font {
            font-family: 'Space Grotesk', sans-serif;
        }

        .glass-card {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .glass-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px -10px rgba(239, 68, 68, 0.2);
        }

        .product-img-container {
            position: relative;
            overflow: hidden;
            aspect-ratio: 1/1;
            background: #fff;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
            transition: transform 0.5s ease;
        }

        .glass-card:hover .product-img {
            transform: scale(1.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* --- ANIMACIONES Y ESTADOS ACTIVOS --- */
        @keyframes rainbowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .filter-btn[data-cat="all"].active,
        .filter-btn[data-cat="all"]:hover {
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            background-size: 400% 400%;
            animation: rainbowBorder 3s ease infinite;
            color: white !important;
            border-color: #ffffff !important;
            border-width: 2px !important;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        .filter-btn[data-cat="gorra"].active,
        .filter-btn[data-cat="gorra"]:hover {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: #ef4444 !important;
            color: #ef4444 !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
            text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
        }

        .filter-btn[data-cat="bandolera"].active,
        .filter-btn[data-cat="bandolera"]:hover {
            background-color: rgba(34, 197, 94, 0.15);
            border-color: #22c55e !important;
            color: #22c55e !important;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
        }

        .filter-btn[data-cat="cadena"].active,
        .filter-btn[data-cat="cadena"]:hover {
            background-color: rgba(59, 130, 246, 0.15);
            border-color: #3b82f6 !important;
            color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            text-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
        }

        .filter-btn[data-cat="gafas"].active,
        .filter-btn[data-cat="gafas"]:hover {
            background-color: rgba(168, 85, 247, 0.15);
            border-color: #a855f7 !important;
            color: #a855f7 !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }

        .filter-btn {
            transition: all 0.3s ease;
        }

        .tag-pill {
            transition: all 0.2s ease;
        }
        .tag-pill:hover {
            background-color: #ef4444;
            color: white;
            border-color: #ef4444;
        }
    </style>
</head>

        let currentSelectedProduct = null;
        let cart = [];

        function formatPrice(price) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0 }).format(price);
        }

        function renderProducts(listToRender) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            if (listToRender.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No se encontraron productos con esa búsqueda o filtro.</div>`;
                return;
            }

            listToRender.forEach(product => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-xl overflow-hidden group';
                card.onclick = () => openModal(product);
                card.innerHTML = `
                    <div class="product-img-container relative">
                        ${product.tag ? `<span class="absolute top-3 left-3 bg-[#ef4444] text-white text-xs font-bold px-2 py-1 rounded z-10">${product.tag}</span>` : ''}
                        <img src="${product.image}" alt="${product.name}" class="product-img" loading="lazy" onerror="this.src='https://placehold.co/600x600/111/fff?text=Quantize+Item'">
                    </div>
                    <div class="p-5">
                        <div class="text-xs text-gray-500 uppercase tracking-wider mb-1">${product.category}</div>
                        <h3 class="text-lg font-bold brand-font mb-2 truncate">${product.name}</h3>
                        <div class="flex justify-between items-center">
                            <span class="text-xl font-bold text-[#ef4444]">${formatPrice(product.price)}</span>
                            <button onclick="event.stopPropagation(); quickAddToCart(${product.id})" class="text-xs bg-white/10 hover:bg-[#ef4444] px-3 py-1.5 rounded-lg font-semibold transition-colors">Agregar 🛒</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.cat === category) {
                    btn.classList.add('active');
                }
            });
            document.getElementById('search-input').value = '';
            if (category === 'all') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === category));
            }
        }

        function filterByTag(keyword) {
            document.getElementById('search-input').value = '';
            const kw = keyword.toLowerCase();
            const filtered = products.filter(p => {
                const nameMatch = p.name.toLowerCase().includes(kw);
                const tagMatch = p.tag && p.tag.toLowerCase().includes(kw);
                
                if (kw === 'futbol') {
                    return nameMatch || tagMatch || p.name.toLowerCase().includes('river') || p.name.toLowerCase().includes('boca') || p.name.toLowerCase().includes('afa') || p.name.toLowerCase().includes('brasil') || p.name.toLowerCase().includes('chicago');
                }
                if (kw === 'argentina') {
                    return nameMatch || tagMatch || p.name.toLowerCase().includes('afa') || p.name.toLowerCase().includes('river') || p.name.toLowerCase().includes('boca');
                }
                if (kw === 'vans') {
                    return nameMatch || tagMatch || p.name.toLowerCase().includes('vans');
                }
                if (kw === 'jordan') {
                    return nameMatch || tagMatch || p.name.toLowerCase().includes('jordan');
                }
                if (kw === 'nike') {
                    return nameMatch || tagMatch || p.name.toLowerCase().includes('nike');
                }
                if (kw === 'chicago') {
                    return nameMatch || tagMatch || p.name.toLowerCase().includes('chicago') || p.name.toLowerCase().includes('bulls');
                }
                return nameMatch || tagMatch;
            });

            renderProducts(filtered);
            document.getElementById('shop').scrollIntoView({ behavior: 'smooth' });
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderProducts(products);
                return;
            }
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.category.toLowerCase().includes(query) || 
                (p.tag && p.tag.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        }

        function openModal(product) {
            currentSelectedProduct = product;
            document.getElementById('modal-img').src = product.image;
            document.getElementById('modal-title').textContent = product.name;
            document.getElementById('modal-price').textContent = formatPrice(product.price);
            document.getElementById('modal-tag').textContent = product.tag || 'QUANTIZE';
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        // --- GESTIÓN DEL CARRITO ---
        function quickAddToCart(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;
            
            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            toggleCartModal();
        }

        function addToCartFromModal() {
            if (!currentSelectedProduct) return;
            const existing = cart.find(item => item.id === currentSelectedProduct.id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...currentSelectedProduct, quantity: 1 });
            }
            closeModal();
            updateCartUI();
            toggleCartModal();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.quantity += change;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.id !== productId);
            }
            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const container = document.getElementById('cart-items-container');
            const totalPriceEl = document.getElementById('cart-total-price');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (totalCount > 0) {
                badge.textContent = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            totalPriceEl.textContent = formatPrice(totalPrice);

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-gray-400">Tu carrito está vacío.</div>`;
                return;
            }

            container.innerHTML = '';
            cart.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/5';
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${item.image}" alt="${item.name}" class="w-12 h-12 object-contain bg-white rounded-lg p-1">
                        <div>
                            <h4 class="text-xs font-bold brand-font line-clamp-1">${item.name}</h4>
                            <div class="text-xs text-[#ef4444] font-semibold">${formatPrice(item.price)}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-black/40 rounded-lg border border-white/10 px-2 py-1">
                            <button onclick="updateQuantity(${item.id}, -1)" class="text-gray-400 hover:text-white px-1 font-bold">-</button>
                            <span class="text-xs font-bold px-2">${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)" class="text-gray-400 hover:text-white px-1 font-bold">+</button>
                        </div>
                        <button onclick="removeFromCart(${item.id})" class="text-red-400 hover:text-red-300 p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function toggleCartModal() {
            const modal = document.getElementById('cart-modal');
            modal.classList.toggle('hidden');
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return;
            let message = "Hola! Me interesa realizar el siguiente pedido:\n\n";
            cart.forEach(item => {
                message += `- ${item.quantity}x *${item.name}* (${formatPrice(item.price * item.quantity)})\n`;
            });
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            message += `\n*Total a pagar: ${formatPrice(total)}*\n\n¿Cómo procedemos con el pago y envío?`;

            const whatsappUrl = `https://wa.me/5491160565501?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        function buyProductDirect() {
            if (!currentSelectedProduct) return;
            const message = `Hola! Me interesa comprar el siguiente producto: *${currentSelectedProduct.name}* por un valor de *${formatPrice(currentSelectedProduct.price)}*. ¿Cómo hacemos?`;
            const whatsappUrl = `https://wa.me/5491160565501?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        function openDirectWhatsApp() {
            const message = `Hola! Vengo de la tienda QUANTIZE y quiero consultar por sus productos.`;
            const whatsappUrl = `https://wa.me/5491160565501?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
            updateCartUI();
        });
    </script>
